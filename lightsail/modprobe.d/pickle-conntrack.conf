# Install to /etc/modprobe.d/pickle-conntrack.conf on the relay.
#
# Purpose: bound the conntrack hash chain length, nothing else. nf_conntrack
# sizes its bucket hash at MODULE LOAD and never resizes it when
# nf_conntrack_max is raised afterwards. The relay loads the module with 3584
# buckets (derived from what the 512 MB box computed as its max at load time),
# and sysctl.d/99-pickle-forward.conf then raises max to 16384 — so a saturated
# table averages ~4.6 entries per bucket, and every lookup walks that chain
# exactly during the flood this sizing exists for. 4096 buckets keeps the
# average chain at 4 or below, for ~4 KB of extra memory (one pointer per added
# bucket).
#
# This is a deliberate chain-length target, NOT a kernel default being restored:
# since 5.15 the kernel derives buckets == nf_conntrack_max, so an untouched box
# would have sized the hash to whatever max it computed at load time.
#
# Takes effect at the next module load, i.e. on reboot. To apply it on a LIVE
# relay, write the parameter instead of reloading the module — the kernel
# rehashes the existing entries in place:
#   echo 4096 | sudo tee /sys/module/nf_conntrack/parameters/hashsize
# Never `rmmod nf_conntrack` on a live relay; that drops every tracked flow,
# SSH included.
#
# Pairs with modules-load.d/pickle-conntrack.conf, which is what guarantees the
# module is loaded before systemd-sysctl applies the sysctls.
# Reboot check: `sysctl net.netfilter.nf_conntrack_buckets` -> 4096.
options nf_conntrack hashsize=4096
