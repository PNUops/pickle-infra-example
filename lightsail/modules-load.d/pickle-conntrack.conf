# Install to /etc/modules-load.d/pickle-conntrack.conf on the relay.
#
# systemd-sysctl.service (which applies /etc/sysctl.d/99-pickle-forward.conf)
# runs at sysinit, but /proc/sys/net/netfilter/ does not exist until the
# nf_conntrack module is loaded — so without this, the nf_conntrack_* keys are
# skipped with only a warning on a fresh boot, reverting max to the stock 3584
# (the DoS this file sizes against) and tcp TIME_WAIT to 120s (which makes the
# agent's ct-count guard falsely throttle legit TCP). systemd-sysctl runs
# After=systemd-modules-load.service, so loading the module here fixes it.
nf_conntrack
