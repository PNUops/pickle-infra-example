#!/usr/sbin/nft -f
# Pickle relay NAT plumbing (port-forwarding). Install to /etc/nftables.conf
# on the relay; loaded by nftables.service at boot.
#
# Ownership is split across TWO tables, deliberately:
#  - inet pickle_relay_static (THIS file): boot-time plumbing — masquerade,
#    MSS clamp, IPv6 band posture. Nothing else writes it.
#  - ip pickle_relay_dnat (NOT in this file): per-mapping DNAT rules, owned
#    exclusively by relay-agent, which creates and atomically replaces its own
#    table. Keeping it out of this file means reloading THIS FILE (`nft -f`)
#    can never wipe live mappings.
#
# NO `flush ruleset` here — the table is destroyed and redefined individually.
# (The sshgw LXC's nftables.conf does start with `flush ruleset`; that pattern
# must not be copied to a box with a second rule owner.)
#
# CAUTION: `nft -f` on this file is safe, but `systemctl restart|stop nftables`
# is NOT — the stock unit's ExecStop runs `nft flush ruleset` (all tables,
# including the agent's), and the agent does not re-assert on an unchanged
# generation. The `nftables.service.d/pickle.conf` drop-in narrows ExecStop to
# this table only; even so, RELOAD, never restart (see the relay runbook).
#
# iifname/oifname (string match), never iif/oif: this file loads at boot
# BEFORE wg0 exists; iif resolves the ifindex at load time, so it would abort
# the whole load and the box would boot with no ruleset at all.

destroy table inet pickle_relay_static
table inet pickle_relay_static {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # Mandatory SNAT for DNAT'd flows entering the tunnel: (a) without it
        # VM replies would exit via the campus NAT default route — asymmetric,
        # TCP dies; (b) WireGuard cryptokey routing drops inner sources
        # outside AllowedIPs, so arbitrary client IPs cannot ride the tunnel.
        # Scoped to the DNAT target net; locally-originated tunnel traffic
        # (agent sync) already sources 100.64.0.1 and needs no NAT.
        oifname "wg0" ip daddr 198.19.0.0/16 masquerade
    }
    chain forward {
        # Policy accept ON PURPOSE: this box had no forward filter before and
        # the narrow per-destination enforcement lives on the campus side.
        # Only DNAT-band flows are ever forwarded here.
        type filter hook forward priority filter; policy accept;
        # TCP MSS clamp, BOTH directions (wg0 MTU 1420 vs public ~1500).
        # `tcp flags & (syn|rst) == syn` matches SYN *and* SYN-ACK (a plain
        # `tcp flags syn` is an exact-flags match and misses SYN-ACK).
        #  - client→VM SYN leaves via wg0: clamp to the route MTU (1420).
        #  - VM→client SYN-ACK arrives via wg0 but leaves via ens5 (1500), so
        #    `rt mtu` would NOT clamp it — pin a fixed 1380 (1420 − 40 hdr) so
        #    the client sizes its upload to the tunnel. Without this the
        #    client→VM bulk path blackholes behind filtered ICMP frag-needed.
        oifname "wg0" tcp flags & (syn|rst) == syn tcp option maxseg size set rt mtu
        iifname "wg0" tcp flags & (syn|rst) == syn tcp option maxseg size set 1380
    }
    chain input {
        # The DNAT band is IPv4-only (targets are private v4). Lightsail
        # assigns public IPv6, so band ports on v6 would otherwise hit the
        # relay's local stack — deny explicitly so v4/v6 behaviour can never
        # diverge. Everything else keeps the box's prior no-filter posture.
        # NOTE: the band 10000-19999 is duplicated from the agent's
        # PICKLE_RELAY_PUBLIC_BAND env — keep the two in sync if the band moves.
        type filter hook input priority filter; policy accept;
        iifname "ens5" meta nfproto ipv6 tcp dport 10000-19999 drop
        iifname "ens5" meta nfproto ipv6 udp dport 10000-19999 drop
    }
}
