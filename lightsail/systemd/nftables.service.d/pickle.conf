# Install to /etc/systemd/system/nftables.service.d/pickle.conf on the relay.
#
# The stock nftables.service ExecStop is `nft flush ruleset`, which on a
# stop/restart wipes EVERY table — including relay-agent's `ip pickle_relay_dnat`
# (live port-forwarding mappings) — and the agent does not re-assert on an
# unchanged generation, so the mappings would stay gone until the next mapping
# change. Narrow ExecStop to this file's own table so a restart cannot take the
# port-forwarding data path down. (relay-agent.service is PartOf=nftables.service
# as a second layer: it restarts with nftables and re-applies via BootReapply.)
[Service]
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet pickle_relay_static
