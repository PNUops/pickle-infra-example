# Pickle relay: forward DNAT'd public flows into the WireGuard tunnel, and size
# conntrack so a flood on one mapping cannot exhaust the shared state table and
# block user SSH on :22 (fate-shared box). Install to
# /etc/sysctl.d/99-pickle-forward.conf on the relay.
net.ipv4.ip_forward = 1

# conntrack sizing (measured 2026-07-28). Stock max on the 512 MB box was 3584 —
# a single host filled it with 4000 UDP datagrams in <1 s. 16384 entries cost
# ~5 MB, well inside free memory.
net.netfilter.nf_conntrack_max = 16384

# Shorter UDP timeouts drain a spoofed flood faster.
net.netfilter.nf_conntrack_udp_timeout = 15
net.netfilter.nf_conntrack_udp_timeout_stream = 60

# TIME_WAIT sizing matters for the relay-agent's per-mapping `ct count` guard:
# nf_connlimit counts conntrack ENTRIES, and TIME_WAIT entries linger at the
# stock 120 s. At 120 s a mapping's steady-state tracked count for a legitimate
# short-connection TCP service is ~120 × conn/s, so `ct count over 512` would
# falsely throttle a healthy service above ~4 conn/s. The relay is a pure NAT
# forwarder (no local TCP services needing long TIME_WAIT), so 30 s is safe and
# raises the legit ceiling to ~17 conn/s per mapping (bursts still ride the
# rate guard's burst allowance).
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
