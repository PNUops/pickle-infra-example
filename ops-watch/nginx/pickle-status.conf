# Static status page on the judge host. No proxying and no scripting: nginx
# serves two files from a directory the judge writes.
limit_req_zone $binary_remote_addr zone=pickle_status:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pickle_status_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name STATUS_NAME;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name STATUS_NAME;
    ssl_certificate /etc/letsencrypt/live/STATUS_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STATUS_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pickle-status;
    limit_req zone=pickle_status burst=20 nodelay;
    limit_conn pickle_status_conn 8;
    client_max_body_size 1k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = / { try_files /index.html =404; }
    location = /index.html { }
    location = /status.json { add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location / { return 404; }
}
