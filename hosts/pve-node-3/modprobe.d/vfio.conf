# pve-node-3: bind the RTX 5090 (both PCI functions) to vfio-pci at boot so a VM can
# take it whole. Installed as /etc/modprobe.d/vfio.conf.
#
# The host keeps the NVIDIA packages installed (they are what the LXC path
# used and they cost nothing while unbound), so the softdep lines are what
# decide who gets the card: whichever path loads nvidia, nouveau or the HDA
# driver, libkmod loads vfio-pci first and a bound device cannot be taken over.
# On this host the binding happens after the root switch (systemd-modules-load
# loads vfio_pci with the ids below); the initrd holds no driver for the card,
# so it plays no part. Run `update-initramfs -u -k all` after editing anyway so
# the initrd copy of this file stays identical.
#
# disable_vga=1 hides the legacy VGA region, which is right for a card that is
# not the boot VGA (ASPEED is). It is incompatible with Proxmox hostpci
# `x-vga=1`; drop it (and rebuild the initrd) before handing the card to a
# guest as its primary display.
options vfio-pci ids=10de:2b85,10de:22e8 disable_vga=1
softdep nvidia pre: vfio-pci
softdep nvidia_drm pre: vfio-pci
softdep nouveau pre: vfio-pci
softdep nova_core pre: vfio-pci
softdep nvidiafb pre: vfio-pci
softdep snd_hda_intel pre: vfio-pci
