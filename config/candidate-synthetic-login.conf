# The outer mTLS stream supplies a PROXY header only over this loopback socket.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name staging.example.com;

    ssl_certificate /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    if ($http_host !~* ^staging\.example\.com(:443)?$) { return 421; }
    if ($remote_addr !~ ^(203\.0\.113\.14|203\.0\.113\.182)$) { return 403; }

    location = /__ingress_probe {
        add_header Cache-Control no-store always;
        add_header X-Observed-Client-IP $remote_addr always;
        default_type text/plain;
        return 200 "candidate-ready";
    }

    location = /login {
        if ($request_uri !~ ^/login(\?.*)?$) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_pass http://198.18.1.20:80/index.html;
        proxy_set_header Host staging.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
    }

    location ^~ /assets/ {
        if ($request_uri !~ ^/assets/[A-Za-z0-9._/-]+(\?.*)?$) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_pass http://198.18.1.20:80;
        proxy_set_header Host staging.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
    }

    location = /pnu-logo.png {
        if ($request_uri !~ ^/pnu-logo\.png(\?.*)?$) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_pass http://198.18.1.20:80;
        proxy_set_header Host staging.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
    }

    location ~ ^/api/v1/auth/(login|mfa|refresh|logout)$ {
        if ($request_uri !~ ^/api/v1/auth/(login|mfa|refresh|logout)(\?.*)?$) { return 404; }
        if ($request_method != POST) { return 404; }
        proxy_pass http://198.18.1.20:80;
        proxy_set_header Host staging.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
    }

    location ~ ^/api/v1/(me|meta/status)$ {
        if ($request_uri !~ ^/api/v1/(me|meta/status)(\?.*)?$) { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        proxy_pass http://198.18.1.20:80;
        proxy_set_header Host staging.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
    }

    location / { return 404; }
}
